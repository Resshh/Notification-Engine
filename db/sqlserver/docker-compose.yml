services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: notifications-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./init.sql:/init/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-C", "-v", "READONLY_PASSWORD=${READONLY_PASSWORD}", "-i", "/init/init.sql"]

volumes:
  sqlserver-data: